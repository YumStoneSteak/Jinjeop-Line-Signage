name: Build and publish v2.6.2
on:
  push:
    branches: [release/build-v2.6.2]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - run: tzutil /s "Korea Standard Time"
      - uses: actions/checkout@v4
        with:
          ref: d9f4d00219b2fb52e297434f5f7bdc63d14d1fb8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify:maintenance
      - run: npm run verify:reliability
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish verified installer and update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v2.6.2 --target d9f4d00219b2fb52e297434f5f7bdc63d14d1fb8 --title "진접선 행선안내기 v2.6.2 · 예약 게시 및 전체화면 공지" --notes-file RELEASE_NOTES.md dist/Jinjeop.Line.Signage.v2.6.2.exe dist/Jinjeop.Line.Signage.v2.6.2.exe.blockmap dist/latest.yml
